[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-merc"
version = "0.1.0"
description = "Causal emotion recognition on precomputed multimodal conversation features"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE.md"}
dependencies = ["torch>=2.1,<3", "numpy>=1.24,<2", "pandas>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1,<2"]

[project.urls]
Repository = "https://github.com/selena-000/Realtime"
Issues = "https://github.com/selena-000/Realtime/issues"

[project.scripts]
realtime-merc-train = "realtime_merc.train:main"
realtime-merc-eval = "realtime_merc.evaluate:main"
realtime-merc-predict = "realtime_merc.predict:main"
realtime-merc-inspect = "realtime_merc.inspect_features:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
